server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:file:./data/orderdb
    driverClassName: org.h2.Driver
    username: sa
    password: password

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:localhost:${server.port}

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/