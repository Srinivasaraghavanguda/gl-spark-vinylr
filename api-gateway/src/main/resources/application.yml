server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Route for Auth Service
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
            
        # Route for Catalog Service
        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/**
            
        # Route for Order Service
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**
            
        # Route for Trending Service
        - id: trending-service
          uri: lb://trending-service
          predicates:
            - Path=/api/trending/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true