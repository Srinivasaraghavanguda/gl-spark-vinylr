server:
  port: 8082

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:h2:file:./data/catalogdb
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
    instance-id: ${spring.application.name}:localhost:${server.port}

  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/